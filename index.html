<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<title>Shop Stock Manager</title>
</head>
<body>
<header>
  <div><h1>Shop Stock Manager</h1><p>Tyre & Battery Inventory</p></div>
  <button id="installBtn" class="secondary hidden">Install</button>
</header>

<main>
<section class="cards">
  <div class="card"><span>🛞 Tyre Qty</span><strong id="tyreQty">0</strong></div>
  <div class="card"><span>🔋 Battery Qty</span><strong id="batteryQty">0</strong></div>
  <div class="card"><span>💰 Stock Value</span><strong id="stockValue">₹0</strong></div>
  <div class="card"><span>⚠️ Low Stock</span><strong id="lowStock">0</strong></div>
</section>

<section class="panel">
  <div class="toolbar">
    <h2>Inventory</h2>
    <div>
      <button onclick="openForm('tyre')">+ Add Tyre</button>
      <button onclick="openForm('battery')">+ Add Battery</button>
    </div>
  </div>
  <input id="search" class="search" placeholder="Search brand, model, size..." oninput="render()">
  <div class="filters">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="tyre">Tyres</button>
    <button class="filter" data-filter="battery">Batteries</button>
  </div>
  <div id="inventory"></div>
</section>
</main>

<div id="modal" class="modal hidden">
  <div class="modalBox">
    <div class="modalHead"><h2 id="modalTitle">Add Product</h2><button onclick="closeForm()">✕</button></div>
    <form id="productForm">
      <input type="hidden" id="editId"><input type="hidden" id="type">
      <label>Brand<input id="brand" required></label>
      <label>Model<input id="model" required></label>
      <label id="sizeLabel">Tyre Size<input id="size"></label>
      <label id="ahLabel" class="hidden">Battery Ah<input id="ah" placeholder="e.g. 65Ah"></label>
      <label>Quantity<input id="qty" type="number" min="0" required></label>
      <label>Purchase Price (₹)<input id="purchase" type="number" min="0" step="0.01" required></label>
      <label>Selling Price (₹)<input id="selling" type="number" min="0" step="0.01" required></label>
      <label id="warrantyLabel" class="hidden">Warranty<input id="warranty" placeholder="e.g. 48 months"></label>
      <label>Supplier<input id="supplier"></label>
      <button type="submit">Save Product</button>
    </form>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
